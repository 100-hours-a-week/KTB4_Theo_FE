name: Frontend CI/CD

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: frontend-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint and Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: react-app

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: react-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Build frontend
        env:
          VITE_API_BASE_URL: /api
        run: npm run build

  build-and-deploy:
    name: Build, Push and Deploy
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: ./react-app
          platforms: linux/amd64
          push: true
          build-args: |
            VITE_API_BASE_URL=/api
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/community-api-fe:latest
            ${{ secrets.DOCKER_USERNAME }}/community-api-fe:${{ github.sha }}
          cache-from: type=gha,scope=community-api-fe
          cache-to: type=gha,mode=max,scope=community-api-fe

      - name: Prepare SSH key
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "${{ secrets.SERVER_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy frontend to EC2
        run: |
          ssh \
            -i ~/.ssh/id_rsa \
            "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}" \
            'set -e
             cd "/home/${USER}/community"
             docker compose pull frontend
             docker compose up -d --no-deps frontend
             sleep 5

             if [ "$(docker inspect --format="{{.State.Running}}" community-api-fe)" != "true" ]; then
               docker compose logs --tail=100 frontend
               exit 1
             fi

             curl --fail --silent --show-error http://127.0.0.1/ > /dev/null
             docker compose ps frontend
             docker image prune -f'
